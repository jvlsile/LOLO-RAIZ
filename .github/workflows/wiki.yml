# Copia las páginas de la carpeta wiki/ a la wiki de GitHub cada vez que cambian en main.
# Solo la primera vez: crea una página cualquiera en la pestaña Wiki para que GitHub cree la wiki.
name: Wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: Actualizar la wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copiar las páginas a la wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" _wiki; then
            echo "::error::La wiki aún no existe. Entra en la pestaña Wiki, crea y guarda una página cualquiera y vuelve a ejecutar esta acción."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ _wiki/
          cd _wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "La wiki ya estaba al día."; exit 0; fi
          git commit -m "Wiki actualizada desde wiki/ (${GITHUB_SHA::8})"
          git push
