# Prueba los juegos y, si todo va bien en la rama main, publica la web en GitHub Pages.
name: Probar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (pizarra, portátil, móvil, iPad e iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          CI: true
      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: playwright-report/
          retention-days: 14

  publicar:
    name: Publicar en GitHub Pages
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web
        run: |
          mkdir -p _site
          # Índice de los audios grabados que ya existen (los que falten usan la voz del navegador)
          python3 scripts/indice-audios.py
          cp -r index.html jugar.html hoy.html asamblea.html registro.html planificacion.html preparar.html fichas.html tres.html fichas-3.html fichas-sentidos.html fichas-cuerpo.html sw.js manifest.webmanifest css js fonts icons audio video _site/
          rm -f _site/audio/guion.csv
          touch _site/.nojekyll
          # Nueva versión del modo sin conexión en cada publicación, para que las pizarras se actualicen
          sed -i "s/const VERSION = 'raiz-dev';/const VERSION = 'raiz-${GITHUB_SHA::8}';/" _site/sw.js
          # Cada publicación pide sus propios estilos y scripts: el navegador nunca mezcla una página nueva con estilos antiguos
          V=${GITHUB_SHA::8}
          sed -i -E "s#(css/portada\.css|js/portada\.js|css/estilos\.css|js/app\.js|js/sentidos-dibujos\.js|js/cuerpo-dibujos\.js)#\1?v=${V}#g" _site/index.html _site/jugar.html _site/sw.js
          grep -q "portada.css?v=${V}" _site/index.html
          grep -q "estilos.css?v=${V}" _site/jugar.html
          grep -q "sentidos-dibujos.js?v=${V}" _site/jugar.html
          grep -q "cuerpo-dibujos.js?v=${V}" _site/jugar.html
          # Todas las páginas de la web tienen que estar publicadas
          for p in hoy asamblea registro planificacion preparar; do test -f "_site/$p.html"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
